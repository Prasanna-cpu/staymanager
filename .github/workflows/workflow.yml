name: Build and Test
on:
  workflow_dispatch:
    pull_request:
    push:
      branches:
        - main
        - feature/CI_and_CD
        - feature/

jobs:
  build:
    name: Maven Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Make maven wrapper executable
        run: chmod +x ./mvnw

      - name: Build and test
        run: ./mvnw clean verify
