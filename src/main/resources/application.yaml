spring:
  application:
    name: staymanager

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    generate-ddl: true

  datasource:
    url: ${DATABASE_URL_LOCALHOST}
    username: ${DATABASE_USERNAME_REGULAR}
    password: ${DATABASE_PASSWORD_REGULAR}

server:
  port: ${PORT}


jwt:
  secret: ${JWT_SECRET}
  access:
    expiration: 86400000
  refresh:
    expiration: 604800000
  header:
    name: ${JWT_HEADER:Authorization}